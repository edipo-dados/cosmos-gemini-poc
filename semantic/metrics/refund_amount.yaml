name: refund_amount
business_name: "Valor de Reembolsos"
description: "Valor total dos reembolsos efetivados (status completed)."
formula: "SUM(refunds.refund_amount WHERE refunds.status = 'completed')"
source:
  system: duckdb
  tables: [fact_orders, fact_order_items, fact_refunds]
grain: item
expression: "COALESCE(SUM(rf.refund_amount), 0)"
base_filter: ""
joins: [refunds_inner]
value_type: money
denominator: "Não se aplica (soma)."
status_rule: "Só reembolsos completed. pending e rejected não contam. Não filtra pelo status do pedido."
time_basis: "Data do pedido de origem do item reembolsado (fact_orders.order_date), não a data do reembolso."
allowed_dimensions: [date, month, year, region, segment, category, product, payment_method, order_status]
applicable_filters:
  dimensions: [date, month, year, region, segment, category, product, payment_method, order_status]
  date_range: true
owner: "Finanças"
version: "1.0.0"
tests:
  - id: total_vs_reference_sql
    type: reconciliation
    description: "Total no DuckDB igual ao SQL de referência no PostgreSQL (oltp), tolerância 0."
    reference_sql: pipelines/quality/reference_sql/refund_amount.sql
    tolerance: "0"
  - id: additive_by_region
    type: invariant
    invariant: additive_by_dimension
    dimension: region
    description: "A soma por região é igual ao total."
  - id: not_greater_than_gross
    type: invariant
    invariant: not_greater_than
    other_metric: gross_revenue
    description: "Reembolsos não excedem a receita bruta."
